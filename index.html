<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedale por Mais Tempo</title>
<style>
:root{--bg:#f4f5f3;--card:#fff;--tx:#1c2420;--mu:#5d6862;--bd:#dfe3df;--g:#1f5c3a;--g2:#2f7d52;--gs:#e4efe8;--dn:#b3261e;--sh:0 1px 3px rgba(0,0,0,.08)}
html[data-theme=dark]{--bg:#16191a;--card:#212628;--tx:#eef1ef;--mu:#9aa5a0;--bd:#353c3e;--g:#4fae7b;--g2:#6cc596;--gs:#26362d;--dn:#f2877f;--sh:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,Arial,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;line-height:1.2}h1{font-size:26px}h2{font-size:20px;margin-bottom:12px}h3{font-size:16px}
p{margin:0 0 8px}.mu{color:var(--mu);font-size:14px}
main{max-width:720px;margin:0 auto;padding:20px 16px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wr{flex-wrap:wrap}.grow{flex:1}
.btn{min-height:46px;padding:10px 18px;border-radius:10px;border:1px solid var(--g);background:var(--g);color:#fff;font:600 15px Inter,Arial,sans-serif;cursor:pointer}
html[data-theme=dark] .btn{color:#0f1a14}
.btn.o{background:transparent;color:var(--g)}.btn.d{background:transparent;border-color:var(--dn);color:var(--dn)}.btn.s{min-height:36px;padding:4px 12px;font-size:14px}.btn.w{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nv button:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:16px Inter,Arial,sans-serif}
textarea{min-height:84px;resize:vertical}input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;min-height:38px;padding:6px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:14px Inter,Arial,sans-serif;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}html[data-theme=dark] .chip.on{color:#0f1a14}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.st b{display:block;font-size:24px;color:var(--g)}.st span{font-size:13px;color:var(--mu)}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--gs);color:var(--g);font-size:12px;font-weight:600}
.empty{text-align:center;color:var(--mu);padding:22px 10px;border:1px dashed var(--bd);border-radius:12px;margin-bottom:12px}
.hero{background:var(--g);color:#fff;border-radius:14px;padding:20px;margin-bottom:14px}html[data-theme=dark] .hero{background:var(--gs);color:var(--tx)}
.hero .btn{background:#fff;color:#1f5c3a;border-color:#fff;margin-top:12px}
.go{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;min-height:56px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:600 16px Inter,Arial,sans-serif;cursor:pointer}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}.bars div{flex:1;background:var(--g);border-radius:4px 4px 0 0;min-height:3px}
.nv{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nv button{flex:1;min-height:62px;border:0;background:none;color:var(--mu);font:600 12px Inter,Arial,sans-serif;cursor:pointer}.nv button i{display:block;font-style:normal;font-size:21px}.nv button.on{color:var(--g)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}.md.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:10;display:none;max-width:90%}
.ck{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);margin:0;font-weight:400;font-size:16px}
.dis{font-size:13px;color:var(--mu);border-left:3px solid var(--g);padding-left:10px;margin:14px 0}
@media(min-width:900px){body{padding:0 0 0 220px}.nv{top:0;right:auto;bottom:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:20px 10px;gap:4px}.nv button{flex:none;min-height:48px;text-align:left;padding:0 14px;border-radius:10px;font-size:15px}.nv button i{display:inline;margin-right:10px}.nv button.on{background:var(--gs)}.md{align-items:center}.sheet{border-radius:16px}main{padding-top:32px}}
body.nl{padding:0!important}body.nl .nv{display:none}.pg{height:12px;background:var(--gs);border-radius:8px;overflow:hidden;margin:8px 0}.pg i{display:block;height:100%;background:var(--g);border-radius:8px}.big{font-size:30px;font-weight:700;color:var(--g)}.sg{display:flex;gap:6px;margin-bottom:12px}.sg .btn{flex:1;min-height:42px;padding:6px}.lg{max-width:420px;margin:0 auto;padding-top:6vh}.card h3{font-size:17px}a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}.hero h1{font-size:28px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="main"></main>
<nav class="nv" id="nav" aria-label="Navegação"></nav>
<div class="md" id="md"><div class="sheet" id="sh"></div></div>
<div class="toast" id="ts"></div>
<script>
const LS=(()=>{const m={};let ok=true;try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){ok=false}return{ok,getItem:k=>{try{return ok?localStorage.getItem(k):(k in m?m[k]:null)}catch(e){return null}},setItem:(k,v)=>{if(ok)localStorage.setItem(k,v);else m[k]=String(v)},removeItem:k=>{if(ok)localStorage.removeItem(k);else delete m[k]}}})();
let cur=LS.getItem('ppmt_sess')||'',KEY='ppmt_u_'+cur,LM=LS.getItem('ppmt_acc')?'in':'up',ER='';
const TYPES={leve:'🌿 Pedal leve',res:'🔥 Pedal de resistência',longo:'🏔️ Pedal longo',mob:'🧘 Mobilidade',fort:'💪 Fortalecimento',desc:'😴 Descanso'};
const RIDE=['leve','res','longo'];
const CATS={res:'🚴 Resistência',fort:'🏋️ Fortalecimento',mob:'🧘 Mobilidade',resp:'🌬️ Respiração',rec:'😌 Recuperação'};
const EX=[
['r1','res','Pedal base em ritmo leve','Construir base aeróbica com conforto.','Pedale em um ritmo em que ainda consiga conversar. Mantenha cadência estável e postura relaxada.','30 a 45 min','Aumente o tempo aos poucos, sem pressa. Reduza se sentir desconforto.'],
['r2','res','Intervalos suaves','Treinar o corpo a alternar esforço e recuperação.','Alterne 3 min um pouco mais fortes (esforço 6 a 7) com 3 min bem leves.','4 a 6 repetições','Pare se sentir tontura ou falta de ar incomum. Não force.'],
['r3','res','Pedal longo progressivo','Ganhar resistência para distâncias maiores.','Acrescente alguns minutos ao seu pedal mais longo recente, mantendo ritmo leve e paradas planejadas.','Conforme sua base','Leve água e alimento. Evite aumentar tempo e intensidade juntos.'],
['f1','fort','Agachamento livre','Fortalecer coxas e glúteos, que sustentam o pedal.','Pés na largura dos ombros, desça com o tronco firme e joelhos alinhados aos pés, depois suba.','2 a 3 séries de 8 a 12','Reduza a amplitude se houver dor no joelho.'],
['f2','fort','Prancha','Estabilizar o tronco e aliviar a postura na bike.','Apoie antebraços e pontas dos pés, corpo alinhado, abdômen firme e respiração contínua.','2 a 3 séries de 20 a 40 s','Não deixe o quadril cair. Pare se sentir dor lombar.'],
['f3','fort','Ponte de glúteos','Ativar glúteos e proteger a lombar.','Deitado, pés no chão e joelhos dobrados. Eleve o quadril, contraia os glúteos e desça devagar.','2 a 3 séries de 10 a 15','Evite arquear demais a lombar.'],
['m1','mob','Alongamento de flexores do quadril','Aliviar a rigidez de quem passa horas sentado na bike.','Em afundo, joelho de trás apoiado, avance o quadril suavemente até sentir alongar a frente da coxa.','30 s cada lado','Alongue sem dor. Não balance o corpo.'],
['m2','mob','Gato-camelo','Soltar a coluna e aliviar a região das costas.','De quatro apoios, alterne arredondar e estender a coluna em movimento lento.','8 a 10 repetições','Movimento suave, dentro do conforto.'],
['m3','mob','Alongamento posterior da coxa','Reduzir a tensão atrás das pernas.','Sentado, uma perna estendida, incline o tronco com as costas alongadas até sentir leve tensão.','30 s cada lado','Nunca alongue até doer.'],
['b1','resp','Respiração diafragmática','Aprender a respirar fundo e controlar o esforço.','Mão na barriga: inspire pelo nariz expandindo o abdômen, expire devagar pela boca.','5 min','Se sentir tontura, volte à respiração normal.'],
['b2','resp','Respiração ritmada no pedal','Manter o esforço sob controle em pedais longos.','No pedal leve, inspire por 3 pedaladas e expire por 3. Ajuste o ritmo ao seu conforto.','5 a 10 min no pedal','Em subidas, priorize o conforto, não o padrão.'],
['b3','resp','Respiração nasal em ritmo leve','Perceber o limite de esforço confortável.','Pedale respirando pelo nariz. Se precisar abrir a boca, reduza um pouco o ritmo.','10 a 15 min','É uma referência de percepção, não uma regra.'],
['c1','rec','Desaceleração final','Ajudar a baixar o ritmo cardíaco depois do esforço.','Nos últimos minutos, pedale leve com cadência solta até a respiração normalizar.','5 a 10 min','Não pare de repente se estiver muito cansado.'],
['c2','rec','Hidratação e refeição pós-pedal','Repor líquidos e energia.','Beba água e faça uma refeição com carboidrato e proteína nas horas seguintes.','Após o pedal','Ajuste ao seu corpo e, se necessário, a um profissional de nutrição.'],
['c3','rec','Descanso ativo','Recuperar sem ficar totalmente parado.','Caminhada leve ou pedal muito leve, sem meta de desempenho.','20 min','Descanso completo também é válido.']
].map(a=>({id:a[0],c:a[1],n:a[2],o:a[3],i:a[4],d:a[5],k:a[6]}));
const MAT=[
['m1','Como dividir um pedal longo','Estrutura','Divida o pedal em blocos: início leve, trecho principal em ritmo constante e final mais solto. Planeje paradas para água e alimento antes de sentir cansaço excessivo. Comece a distância nova aos poucos e repita até ficar confortável.'],
['m2','Hidratação e alimentação: princípios gerais','Alimentação','Leve água em todos os pedais. Em pedais longos, inclua um alimento de fácil digestão (banana, barra de cereal) em intervalos regulares. As necessidades variam por pessoa e clima; teste no treino, nunca só em dias importantes.'],
['m3','Escala de esforço percebido (1 a 10)','Esforço','1 a 3: muito leve, conversa fácil. 4 a 6: moderado, frases curtas. 7 a 8: forte, respiração marcada. 9 a 10: máximo. Em pedais longos, a maior parte do tempo costuma ficar entre 3 e 6.'],
['m4','Como montar sua semana','Planejamento','Distribua pedais leves, um de resistência e um mais longo, com dias de mobilidade, fortalecimento e descanso entre eles. Não existe semana perfeita: ajuste conforme agenda e sensação do corpo.'],
['m5','Recuperação básica','Recuperação','Sono, hidratação, alimentação e dias leves fazem parte da evolução. Sinais de cansaço persistente pedem reduzir a carga e, se continuarem, procurar um profissional.'],
['m6','O que observar na bike antes de sair','Equipamento','Pneus calibrados, freios respondendo, corrente limpa e lubrificada, parafusos firmes, capacete ajustado. Se algo parecer estranho, resolva antes de pedalar.']
].map(a=>({id:a[0],t:a[1],c:a[2],x:a[3]}));
const TPL=[['leve',40,0,'Pedal leve para criar base'],['mob',20,0,'Mobilidade de quadril e coluna'],['res',50,15,'Pedal com intervalos suaves'],['fort',25,0,'Agachamento, prancha e ponte'],['leve',45,12,'Pedal leve com respiração ritmada'],['longo',90,25,'Pedal longo em ritmo constante'],['desc',0,0,'Descanso ativo ou total']];
const addD=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const CHK=['Bicicleta revisada','Pneus verificados','Freios verificados','Corrente lubrificada','Capacete e equipamentos','Água','Alimentação adequada à duração','Celular carregado','Percurso planejado e pontos de apoio','Condições físicas avaliadas'];
const REC=['Hidratar','Alimentar-se bem','Alongar de forma leve','Descansar o suficiente'];
const def=()=>({name:'',theme:'',plans:[],logs:[],favs:[],done:[],exn:{},notes:[],check:{},prep:{rec:{}}});
let S=load(),V='home',cat='all',q='',mq='',nq='';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=d=>d?d.split('-').reverse().join('/'):'';
const fh=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'):m+' min'};
const n1=x=>(Math.round(x*10)/10).toLocaleString('pt-BR');
function load(){try{const r=LS.getItem(KEY);const o=r?JSON.parse(r):{};return Object.assign(def(),o)}catch(e){setTimeout(()=>toast('Não foi possível ler os dados salvos. Restaure um backup em Configurações.'),300);return def()}}
function save(){try{LS.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível salvar neste navegador. Exporte um backup.')}}
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}
function theme(){const t=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}
function openM(h){$('#sh').innerHTML=h;$('#md').classList.add('on')}
function closeM(){$('#md').classList.remove('on')}
const spd=l=>l.km/(l.min/60),pace=l=>l.min/l.km;
const empty=(t,b)=>'<div class="empty">'+t+(b?'<div style="margin-top:10px">'+b+'</div>':'')+'</div>';
const DISC='<p class="dis">Conteúdo educativo. Não substitui orientação médica, fisioterapêutica ou de educação física. Não treine com dor aguda. Interrompa a atividade e procure atendimento se sentir dor no peito, desmaio, falta de ar incomum ou outro sintoma grave. Ajuste a carga à sua experiência e condição física.</p>';
const TABS=[['home','🏠','Início'],['plan','📅','Planejar'],['ex','💪','Exercícios'],['log','🚴','Meu pedal'],['more','⋯','Mais']];
const TABOF={home:'home',plan:'plan',ex:'ex',log:'log'};
const planCard=p=>'<div class="card"><div class="row sp"><div><span class="tag">'+TYPES[p.type]+'</span><h3 style="margin-top:6px">'+fd(p.date)+'</h3><p class="mu">'+(p.dur?p.dur+' min':'')+(p.dur&&p.dist?' · ':'')+(p.dist?n1(p.dist)+' km':'')+'</p>'+(p.obs?'<p>'+esc(p.obs)+'</p>':'')+'</div><input type="checkbox" aria-label="Concluída" data-a="tp" data-id="'+p.id+'" '+(p.done?'checked':'')+'></div><div class="row" style="margin-top:8px"><button class="btn o s" data-a="ep" data-id="'+p.id+'">Editar</button><button class="btn d s" data-a="dp" data-id="'+p.id+'">Excluir</button></div></div>';
const logCard=l=>'<div class="card"><div class="row sp"><h3>'+fd(l.date)+' · '+TYPES[l.type]+'</h3><span class="tag">Esforço '+l.rpe+'/10</span></div><p class="mu">'+n1(l.km)+' km · '+fh(l.min)+' · '+n1(spd(l))+' km/h · '+n1(pace(l))+' min/km (cálculo)</p>'+(l.feel?'<p>Sensação: '+esc(l.feel)+'</p>':'')+(l.obs?'<p class="mu">'+esc(l.obs)+'</p>':'')+'<div class="row"><button class="btn o s" data-a="el" data-id="'+l.id+'">Editar</button><button class="btn d s" data-a="dl" data-id="'+l.id+'">Excluir</button></div></div>';
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
const V_={
home(){const up=S.plans.filter(p=>!p.done&&p.date>=today()).sort(byDate)[0],ls=[...S.logs].sort(byDate).reverse().slice(0,3);
return '<div class="hero"><h1>Pedale por Mais Tempo</h1><p style="margin-top:8px">'+(S.name?'Olá, '+esc(S.name)+'. ':'Olá. ')+'Prepare-se, registre e acompanhe a sua evolução.</p><button class="btn" data-a="go" data-id="prep">🚀 Começar preparação</button></div>'
+(S.logs.length||S.plans.length?'':empty('<b>Primeira vez por aqui?</b><br>Comece planejando uma atividade ou registrando o seu último pedal. Tudo fica salvo neste navegador.'))
+'<a class="btn w" style="margin-bottom:10px" href="https://drive.google.com/file/d/1vtHCEt8h-rYj_wtc3b8yHwbWZaoQYXt5/view?usp=drive_link" target="_blank" rel="noopener">📄 Abrir PDF das aulas</a><button class="go" data-a="go" data-id="plan">📅 Planejar atividade<span>›</span></button><button class="go" data-a="go" data-id="ex">💪 Consultar exercícios<span>›</span></button><button class="go" data-a="go" data-id="log">🚴 Registrar pedal<span>›</span></button><button class="go" data-a="go" data-id="evo">📈 Ver minha evolução<span>›</span></button>'
+'<h2 style="margin-top:18px">🗓️ Próxima atividade</h2>'+(up?planCard(up):empty('Nenhuma atividade planejada.'))
+'<h2>🏁 Últimos pedais</h2>'+(ls.length?ls.map(logCard).join(''):empty('Nenhum pedal registrado ainda.'))
+'<div class="stats"><div class="st"><b>'+S.logs.length+'</b><span>pedais registrados</span></div><div class="st"><b>'+n1(S.logs.reduce((a,l)=>a+l.km,0))+' km</b><span>distância total</span></div></div>'+DISC},
plan(){const up=S.plans.filter(p=>!p.done).sort(byDate),h=S.plans.filter(p=>p.done).sort(byDate).reverse();
return '<div class="row sp"><h2>📅 Meu planejamento</h2><button class="btn" data-a="np">➕ Nova atividade</button></div><p class="mu">Monte a sua semana do seu jeito. Os modelos são exemplos educativos e ajustáveis.</p>'
+'<div class="card"><h3>📋 Modelos prontos</h3><p class="mu">Toque para adicionar à sua agenda. Depois é só ajustar.</p><button class="btn w" data-a="wk" style="margin:8px 0">🗓️ Adicionar semana modelo</button>'+TPL.map((t,i)=>'<button class="go" data-a="at" data-id="'+i+'"><span>'+TYPES[t[0]]+' · '+t[1]+' min'+(t[2]?' · '+t[2]+' km':'')+'<br><small class="mu">'+t[3]+'</small></span><span>➕</span></button>').join('')+'</div><h3 style="margin:14px 0 8px">⏭️ Próximas</h3>'+(up.length?up.map(planCard).join(''):empty('Nada planejado.','<button class="btn o" data-a="np">Criar a primeira atividade</button>'))
+'<h3 style="margin:14px 0 8px">Histórico</h3>'+(h.length?h.map(planCard).join(''):empty('Atividades concluídas aparecem aqui.'))},
ex(){const l=EX.filter(e=>(cat=='all'||e.c==cat)&&(e.n+e.o+e.i).toLowerCase().includes(q.toLowerCase()));
return '<h2>💪 Biblioteca de exercícios</h2><input id="qs" placeholder="Buscar exercício" value="'+esc(q)+'" data-a="srch" aria-label="Buscar"><div class="chips" style="margin-top:10px"><button class="chip '+(cat=='all'?'on':'')+'" data-a="cat" data-id="all">Todos</button>'+Object.keys(CATS).map(k=>'<button class="chip '+(cat==k?'on':'')+'" data-a="cat" data-id="'+k+'">'+CATS[k]+'</button>').join('')+'</div>'
+(l.length?l.map(e=>'<button class="go" data-a="ox" data-id="'+e.id+'"><span>'+(S.favs.includes(e.id)?'★ ':'')+e.n+'<br><small class="mu">'+CATS[e.c]+' · '+e.d+(S.done.includes(e.id)?' · concluído':'')+'</small></span><span>›</span></button>').join(''):empty('Nenhum exercício encontrado.'))+DISC},

document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.a=='tp')A.tp(t.dataset.id);
else if(t.dataset.c!=null){S.check[t.dataset.c]=t.checked;save()}
else if(t.dataset.r!=null){S.prep.rec[t.dataset.r]=t.checked;save()}
else if(t.dataset.p){S.prep[t.dataset.p]=t.value;save()}
else if(t.dataset.exn){S.exn[t.dataset.exn]=t.value;save()}
else if(t.dataset.p2){S[t.dataset.p2]=t.value.trim();save();render()}
else if(t.id=='fi'){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(typeof o!='object'||!Array.isArray(o.logs||[])||!Array.isArray(o.plans||[]))throw 0;if(!confirm('Restaurar este backup? Os dados atuais serão substituídos.'))return;S=Object.assign(def(),o);save();render();toast('Backup restaurado')}catch(x){toast('Arquivo de backup inválido.')}};r.readAsText(t.files[0])}});
document.addEventListener('input',e=>{const t=e.target,m={srch:()=>{q=t.value},srchm:()=>{mq=t.value},srchn:()=>{nq=t.value}}[t.dataset.a];
if(t.dataset.calc){calc();return}if(m){m();const p=t.selectionStart,id=t.id;render();const n=$('#'+id);n.focus();n.setSelectionRange(p,p)}});
render();
</script>
</body>
</html>
